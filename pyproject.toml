[build-system]
requires = [
        "setuptools >= 61.0", 
        "forthon>=0.10.7", 
        "wheel",
    ]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "uedge"
dependencies = [
    "forthon>=0.10.7",
    "numpy",
#    "h5py>=3.14,<4 ; python_version >= '3.10'",
#    "h5py<3.15  ; python_version < '3.10'",
]
requires-python = ">= 3.9"
authors = [
  {name = "Tom Rognlien"}
]
maintainers = [
  {name = "Bill Meyer", email = "meyer8@llnl.gov"},
  {name = "Andreas Holm", email = "holm10@llnl.gov"}
]
description = "2D Fluid simulation of plasma and neutrals in magnetic fusion devices"
readme = "README.md"
keywords = [
    "plasma",
    "fusion",
    "tokamak",
    "edge-plasma",
    "scrape-off layer",
    "multi-fluid"
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Fortran",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)"
]
license = {file = "LICENSE"}

[project.urls]
Homepage = "https://github.com/LLNL/UEDGE/"
#Documentation = "https://readthedocs.org"
Repository = "https://github.com/LLNL/UEDGE.git"
Issues = "https://github.com/LLNL/UEDGE/issues"
#Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"




[project.optional-dependencies]
ueplot = [
    "matplotlib",
    "scipy",
    "scikit-image",
    "h5py",
]


[tool.setuptools]
packages = [
    "uedge",
    "uedge.rates",
]
script-files = [
    "pyscripts/pdb2hdf5",
    "pyscripts/bas2py",
    "pyscripts/hdf52pdb",
]

[tool.setuptools.package-data]
uedge = ["VERSION", "_build_info.json"]
"uedge.rates" = ["aph/*.dat"]


[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.dynamic]
version = {file = ["src/uedge/VERSION"]}

